<!doctype html>
<html lang="zh-CN">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var q=new URLSearchParams(location.search).get("theme");var t=q||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();</script><meta charset="utf-8"><title>SettingsRow — preview</title><style>html,body{margin:0;background:var(--bg-grouped)}</style></head>
<body>
<div class="jr">
<div class="jr-canvas">
<div style="width:390px">
<div class="jr-list">
 <div class="jr-cell" style="--lead:42px"><span class="jr-icon-tile jam"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg></span><span class="main"><span class="t">阅读时保持亮屏</span></span><span class="jr-toggle on"></span></div>
 <div class="jr-cell" style="--lead:42px"><span class="jr-icon-tile indigo"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg></span><span class="main"><span class="t">最近加入</span></span><span class="val">30 天</span><span class="chev"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></span></div>
 <div class="jr-cell" style="--lead:42px"><span class="jr-icon-tile gray"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></span><span class="main"><span class="t">继续阅读显示在</span></span><span class="val">书库首页</span><span class="chev"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></span></div>
</div>
<div class="jr-groupfoot">书库首页：汇总所有本地书库。各书库内：每个书库单独显示。</div>
<div class="jr-grouphead">存储</div>
<div class="jr-list" style="padding:14px 16px">
 <div style="display:flex;justify-content:space-between;font-size:15px"><b>JamReader 占用</b><span style="color:var(--ink-2)">6.8 GB</span></div>
 <div class="jr-meter" style="margin-top:10px"><i style="width:46%;background:var(--jam)"></i><i style="width:24%;background:var(--chart-downloads)"></i><i style="width:8%;background:var(--chart-temp)"></i><i style="width:4%;background:var(--chart-thumbs)"></i></div>
 <div class="jr-legend"><span><i class="jr-dot" style="background:var(--jam)"></i>书库漫画 4.4 GB</span><span><i class="jr-dot" style="background:var(--chart-downloads)"></i>远程下载 1.6 GB</span><span><i class="jr-dot" style="background:var(--chart-temp)"></i>临时数据 540 MB</span><span><i class="jr-dot" style="background:var(--chart-thumbs)"></i>远程封面 280 MB</span></div>
</div></div></div>
</div>
</body>
</html>
