name: Static Guards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-guards:
    name: Static Guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run project static guards
        run: ./scripts/check_project_static_guards.sh
